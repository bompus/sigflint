<svg xmlns="http://www.w3.org/2000/svg" width="760" height="654" viewBox="0 0 760 654" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Signing time per request</title><desc id="d">sigflint 1.3/1.6 µs, aws4fetch 219.6/196.9 µs, aws4 5.7/5.9 µs, @smithy/signature-v4 9.7/9.3 µs, aws-sig 59.5/45.4 µs, @wdl-dev/aws-sigv4 675.4/591.8 µs, minio 11.4/6.8 µs</desc>
<rect width="760" height="654" rx="8" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Time to sign one request, plain GET (lower is better)</text><text x="20" y="48" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Median of 3 separate processes per library and runtime; log scale. A plain GET, which every library here signs correctly.</text><text x="20" y="65" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Measured before the S3 code was split into modules; the shipped code is within 4% of it (no clear change).</text><text x="20" y="98" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">Node.js 26.12.0</text><line x1="190" y1="106" x2="190" y2="304" stroke="#d1d9e0"/><text x="190" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">1</text><line x1="323.33333333333337" y1="106" x2="323.33333333333337" y2="304" stroke="#d1d9e0"/><text x="323.33333333333337" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">10</text><line x1="456.6666666666667" y1="106" x2="456.6666666666667" y2="304" stroke="#d1d9e0"/><text x="456.6666666666667" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">100</text><line x1="590" y1="106" x2="590" y2="304" stroke="#d1d9e0"/><text x="590" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">1,000</text><text x="180" y="126" font-size="12" fill="#1f2328" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="112" width="16.557074063290003" height="19" rx="3" fill="#bc4c00"/><text x="212.55707406329" y="126" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1.33 µs</text><text x="180" y="154" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="140" width="100.34482383205454" height="19" rx="3" fill="#8c959f"/><text x="296.34482383205454" y="154" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5.66 µs  (4.3×)</text><text x="180" y="182" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="168" width="131.85540273502488" height="19" rx="3" fill="#8c959f"/><text x="327.8554027350249" y="182" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9.75 µs  (7.3×)</text><text x="180" y="210" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">minio</text><rect x="190" y="196" width="140.93080488908174" height="19" rx="3" fill="#8c959f"/><text x="336.93080488908174" y="210" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">11.4 µs  (8.6×)</text><text x="180" y="238" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="224" width="236.554555213203" height="19" rx="3" fill="#8c959f"/><text x="432.554555213203" y="238" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">59.5 µs  (45×)</text><text x="180" y="266" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="252" width="312.20683254442696" height="19" rx="3" fill="#8c959f"/><text x="508.20683254442696" y="266" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">220 µs  (165×)</text><text x="180" y="294" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="280" width="377.27163519664737" height="19" rx="3" fill="#8c959f"/><text x="573.2716351966474" y="294" font-size="12" fi