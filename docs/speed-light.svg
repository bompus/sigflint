<svg xmlns="http://www.w3.org/2000/svg" width="760" height="654" viewBox="0 0 760 654" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Signing time per request</title><desc id="d">sigflint 1.3/1.4 µs, aws4fetch 232.6/212.8 µs, aws4 5.6/5.8 µs, @smithy/signature-v4 9.6/9.2 µs, aws-sig 55.5/38.6 µs, @wdl-dev/aws-sigv4 724.9/580.1 µs, minio 10.9/7.0 µs</desc>
<rect width="760" height="654" rx="8" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Time to sign one request, plain GET (lower is better)</text><text x="20" y="48" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Median of 3 separate processes per library and runtime; log scale. A plain GET, which every library here signs correctly.</text><text x="20" y="65" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Measured before the S3 code was split into modules; the shipped code is within 4% of it (no clear change).</text><text x="20" y="98" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">Node.js 26.12.0</text><line x1="190" y1="106" x2="190" y2="304" stroke="#d1d9e0"/><text x="190" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">1</text><line x1="323.33333333333337" y1="106" x2="323.33333333333337" y2="304" stroke="#d1d9e0"/><text x="323.33333333333337" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">10</text><line x1="456.6666666666667" y1="106" x2="456.6666666666667" y2="304" stroke="#d1d9e0"/><text x="456.6666666666667" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">100</text><line x1="590" y1="106" x2="590" y2="304" stroke="#d1d9e0"/><text x="590" y="320" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">1,000</text><text x="180" y="126" font-size="12" fill="#1f2328" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="112" width="15.768630145263899" height="19" rx="3" fill="#bc4c00"/><text x="211.7686301452639" y="126" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1.31 µs</text><text x="180" y="154" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="140" width="99.38494950933449" height="19" rx="3" fill="#8c959f"/><text x="295.3849495093345" y="154" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5.56 µs  (4.2×)</text><text x="180" y="182" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="168" width="131.16820803815529" height="19" rx="3" fill="#8c959f"/><text x="327.1682080381553" y="182" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9.63 µs  (7.3×)</text><text x="180" y="210" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">minio</text><rect x="190" y="196" width="138.41377470745306" height="19" rx="3" fill="#8c959f"/><text x="334.41377470745306" y="210" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10.9 µs  (8.3×)</text><text x="180" y="238" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="224" width="232.5348249587621" height="19" rx="3" fill="#8c959f"/><text x="428.5348249587621" y="238" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">55.5 µs  (42×)</text><text x="180" y="266" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="252" width="315.5554294248208" height="19" rx="3" fill="#8c959f"/><text x="511.5554294248208" y="266" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">233 µs  (177×)</text><text x="180" y="294" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="280" width="381.37320907717276" height="19" rx="3" fill="#8c959f"/><text x="577.3732090771728" y="294" font-size="12" fi