<svg xmlns="http://www.w3.org/2000/svg" width="780" height="328" viewBox="0 0 780 328" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Size of sigflint by signer</title><desc id="d">headers 2774 B gzip, headers + presign 3352 B gzip, SigV4a headers 2980 B gzip, SigV4a presign 3026 B gzip, chunked uploads 1516 B gzip, event streams 1613 B gzip, everything 5128 B gzip</desc>
<rect width="780" height="328" rx="8" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">What you ship depends on what you import (lower is better)</text><text x="20" y="48" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">sigflint’s Node entry bundled with only the named signers, minified, then gzip.</text><line x1="170" y1="70" x2="170" y2="282" stroke="#d1d9e0"/><text x="170" y="296" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">0 kB</text><line x1="258" y1="70" x2="258" y2="282" stroke="#d1d9e0"/><text x="258" y="296" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">1 kB</text><line x1="346" y1="70" x2="346" y2="282" stroke="#d1d9e0"/><text x="346" y="296" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">2 kB</text><line x1="434" y1="70" x2="434" y2="282" stroke="#d1d9e0"/><text x="434" y="296" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">3 kB</text><line x1="522" y1="70" x2="522" y2="282" stroke="#d1d9e0"/><text x="522" y="296" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">4 kB</text><line x1="610" y1="70" x2="610" y2="282" stroke="#d1d9e0"/><text x="610" y="296" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">5 kB</text><text x="160" y="92" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">headers</text><rect x="170" y="78" width="244.11199999999997" height="20" rx="3" fill="#bc4c00"/><text x="420.11199999999997" y="92" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">2.8 kB gzip · 5.7 kB minified</text><text x="160" y="122" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">headers + presign</text><rect x="170" y="108" width="294.976" height="20" rx="3" fill="#bc4c00"/><text x="470.976" y="122" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">3.4 kB gzip · 7.3 kB minified</text><text x="160" y="152" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">SigV4a headers</text><rect x="170" y="138" width="262.24" height="20" rx="3" fill="#bc4c00"/><text x="438.24" y="152" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">3.0 kB gzip · 6.1 kB minified</text><text x="160" y="182" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">SigV4a presign</text><rect x="170" y="168" width="266.28799999999995" height="20" rx="3" fill="#bc4c00"/><text x="442.28799999999995" y="182" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">3.0 kB gzip · 6.1 kB minified</text><text x="160" y="212" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">chunked uploads</text><rect x="170" y="198" width="133.40800000000002" height="20" rx="3" fill="#bc4c00"/><text x="309.408" y="212" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">1.5 kB gzip · 2.9 kB minified</text><text x="160" y="242" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">event streams</text><rect x="170" y="228" width="141.94400000000002" height="20" rx="3" fill="#bc4c00"/><text x="317.944" y="242" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">1.6 kB gzip · 3.1 kB minified</text><text x="160" y="272" font-size="12" fill="#1f2328" text-anchor="end" font-weight="400">everything</text><rect x="170" y="258" width="451.264" height="20" rx="3" fill="#bc4c00"/><text x="627.264" y="272" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">5.1 kB gzip · 12.3 kB minified</text><text x="20" y="316" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">Bundled with bun build --minify; Node and Bun built-ins are not counted.</text>
</svg>
