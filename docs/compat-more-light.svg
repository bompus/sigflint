ont-weight="400">28.8%</text><text x="180" y="1418" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="1404" width="520" height="19" fill="#afb8c1"/><text x="720" y="1418" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0.0%</text><rect x="190" y="1444" width="12" height="12" fill="#116329"/><text x="208" y="1454" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">same signature</text><rect x="320" y="1444" width="12" height="12" fill="#a40e26"/><text x="338" y="1454" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">different signature</text><rect x="470" y="1444" width="12" height="12" fill="#afb8c1"/><text x="488" y="1454" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">cannot express the request, or does not offer it</text><text x="20" y="1478" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">aws4’s differences are headers it adds and signs itself (content-length, a default content-type), so its signature is valid for what it sends.</text><text x="20" y="1494" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">sigflint is not in the comparison run: it signs all of the same cases in its own test suite (npm test).</text><text x="20" y="1510" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">Payload opt-out outside S3: aws4fetch signs the opt-out header too; aws-sig has no opt-out, so it is counted as unsupported.</text><text x="20" y="1548" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">S3 clients use decoded keys; gray cells reflect their S3 APIs. A different signature does not establish rejection.</text>
</svg>
