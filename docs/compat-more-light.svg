<text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Same signature as botocore: other services and presigned URLs (higher is better)</text><text x="20" y="48" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">S3 clients use decoded keys; tiny-oss other-service headers use a caller-prepared canonical path.</text><text x="20" y="78" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">Header signing, 15 other services: 1,622 requests</text><text x="180" y="106" font-size="12" fill="#1f2328" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="92" width="520" height="19" fill="#116329"/><text x="720" y="106" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">100.0%</text><text x="180" y="134" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="120" width="298.15043156596795" height="19" fill="#116329"/><rect x="488.15043156596795" y="120" width="221.84956843403205" height="19" fill="#a40e26"/><text x="720" y="134" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">57.3%</text><text x="180" y="162" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="148" width="439.5314426633785" height="19" fill="#116329"/><rect x="629.5314426633786" y="148" width="80.46855733662146" height="19" fill="#afb8c1"/><text x="720" y="162" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">84.5%</text><text x="180" y="190" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="176" width="248.77928483353884" height="19" fill="#116329"/><rect x="438.77928483353884" y="176" width="271.22071516646116" height="19" fill="#a40e26"/><text x="720" y="190" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">47.8%</text><text x="180" y="218" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">lean-s3</text><rect