<title id="t">Correctness against botocore: other services and presigned URLs</title><desc id="d">Header signing, 15 other services: sigflint 1622/1622, aws4 930/1622, aws4fetch 1371/1622, aws-sig 776/1622, minio 0/1622, @smithy/signature-v4 1622/1622, @wdl-dev/aws-sigv4 826/1622. Presigned URLs, other services: sigflint 696/696, aws4 696/696, aws4fetch 696/696, aws-sig 183/696, minio 0/696, @smithy/signature-v4 696/696, @wdl-dev/aws-sigv4 0/696. Presigned URLs, S3: sigflint 777/777, aws4 777/777, aws4fetch 777/777, aws-sig 0/777, minio 598/777, @smithy/signature-v4 777/777, @wdl-dev/aws-sigv4 0/777</desc>
<rect width="780" height="864" rx="8" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Same signature as botocore: other services and presigned URLs (higher is better)</text><text x="20" y="48" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Each library is called through its normal public API on the same requests, key and clock.</text><text x="20" y="78" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">Header signing, 15 other services: 1,622 requests</text><text x="180" y="106" font-size="12" fill="#1f2328" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="92" width="520" height="19" fill="#116329"/><text x="720" y="106" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">100.0%</text><text x="180" y="134" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="120" width="298.15043156596795" height="19" fill="#116329"/><rect x="488.15043156596795" y="120" width="221.84956843403205" height="19" fill="#a40e26"/><text x="720" y="134" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">57.3%</text><text x="180" y="162" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="148" width="439.5314426633785" height="19" fill="#116329"/><rect x="629.5314426633786" y="148" width="80.46855733662146" height="19" fill="#afb8c1"/><text x="720" y="162" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">84.5%</text><text x="180" y="190" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="176" width="248.77928483353884" height="19" fill="#116329"/><rect x="438.77928483353884" y="176" width="271.22071516646116" height="19" fill="#a40e26"/><text x="720" y="190" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">47.8%</text><text x="180" y="218" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">minio</text><rect x="190" y