ill="#59636e" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="640" width="520" height="19" fill="#a40e26"/><text x="720" y="654" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0.0%</text><text x="180" y="682" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">minio</text><rect x="190" y="668" width="400.2059202059202" height="19" fill="#116329"/><rect x="590.2059202059202" y="668" width="119.79407979407979" height="19" fill="#a40e26"/><text x="720" y="682" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">77.0%</text><text x="180" y="710" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="696" width="520" height="19" fill="#116329"/><text x="720" y="710" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">100.0%</text><text x="180" y="738" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="724" width="520" height="19" fill="#afb8c1"/><text x="720" y="738" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0.0%</text><rect x="190" y="764" width="12" height="12" fill="#116329"/><text x="208" y="774" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">same signature</text><rect x="320" y="764" width="12" height="12" fill="#a40e26"/><text x="338" y="774" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">different signature</text><rect x="470" y="764" width="12" height="12" fill="#afb8c1"/><text x="488" y="774" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">cannot express the request, or does not offer it</text><text x="20" y="798" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">aws4’s differences are headers it adds and signs itself (content-length, a default content-type), so its signature is valid for what it sends.</text><text x="20" y="814" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">sigflint is not in the comparison run: it signs all of the same cases in its own test suite (npm test). 127 presigned URLs without payload signing are left out.</text><text x="20" y="852" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">Not assessed: lean-s3, s3-lite-client, s3mini, tiny-oss.</text>
</svg>
