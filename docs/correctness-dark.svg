<svg xmlns="http://www.w3.org/2000/svg" width="780" height="558" viewBox="0 0 780 558" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Correctness against botocore</title><desc id="d">Ordinary requests: sigflint 1211/1211, aws4fetch 1208/1211, aws4 1063/1211, @smithy/signature-v4 596/1211, @wdl-dev/aws-sigv4 358/1211, minio 255/1211, aws-sig 78/1211. Edge cases: sigflint 1522/1522, aws4fetch 595/1522, aws4 268/1522, @smithy/signature-v4 236/1522, @wdl-dev/aws-sigv4 44/1522, minio 3/1522, aws-sig 12/1522</desc>
<rect width="780" height="558" rx="8" fill="#0d1117"/>
<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Same signature as botocore (higher is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">Every library signs the same request with the same key and clock. A signature that differs by one character fails.</text><text x="20" y="74" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Ordinary requests: 1,211 requests</text><text x="180" y="102" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="88" width="520" height="19" fill="#3fb950"/><text x="720" y="102" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">100.0%</text><text x="180" y="130" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="116" width="518.7118084227911" height="19" fill="#3fb950"/><rect x="708.7118084227911" y="116" width="1.2881915772089183" height="19" fill="#f85149"/><text x="720" y="130" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">99.8%</text><text x="180" y="158" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="144" width="456.44921552436006" height="19" fill="#3fb950"/><rect x="646.44921552436" y="144" width="63.550784475639965" height="19" fill="#f85149"/><text x="720" y="158" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">87.8%</text><text x="180" y="186" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="172" width="255.92072667217175" height="19" fill="#3fb950"/><rect x="445.9207266721718" y="172" width="264.0792733278282" height="19" fill="#f85149"/><text x="720" y="186" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">49.2%</text><text x="180" y="214" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="20