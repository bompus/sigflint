<svg xmlns="http://www.w3.org/2000/svg" width="780" height="328" viewBox="0 0 780 328" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Size of sigflint by signer</title><desc id="d">headers 2769 B gzip, headers + presign 3346 B gzip, SigV4a headers 2976 B gzip, SigV4a presign 3023 B gzip, chunked uploads 1457 B gzip, event streams 1613 B gzip, everything 5078 B gzip</desc>
<rect width="780" height="328" rx="8" fill="#0d1117"/>
<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">What you ship depends on what you import (lower is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">sigflint’s Node entry bundled with only the named signers, minified, then gzip.</text><line x1="170" y1="70" x2="170" y2="282" stroke="#30363d"/><text x="170" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">0 kB</text><line x1="258" y1="70" x2="258" y2="282" stroke="#30363d"/><text x="258" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1 kB</text><line x1="346" y1="70" x2="346" y2="282" stroke="#30363d"/><text x="346" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">2 kB</text><line x1="434" y1="70" x2="434" y2="282" stroke="#30363d"/><text x="434" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">3 kB</text><line x1="522" y1="70" x2="522" y2="282" stroke="#30363d"/><text x="522" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">4 kB</text><line x1="610" y1="70" x2="610" y2="282" stroke="#30363d"/><text x="610" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">5 kB</text><text x="160" y="92" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">headers</text><rect x="170" y="78" width="243.67200000000003" height="20" rx="3" fill="#f0883e"/><text x="419.672" y="92" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">2.8 kB gzip · 5.7 kB minified</text><text x="160" y="122" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">headers + presign</text><rect x="170" y="108" width="294.448" height="20" rx="3" fill="#f0883e"/><text x="470.448" y="122" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">3.3 kB gzip · 7.3 kB minified</text><text x="160" y="152" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">SigV4a headers</text><rect x="170" y="138" width="261.88800000000003" height="20" rx="3" fill="#f0883e"/><text x="437.88800000000003" y="152" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">3.0 kB gzip · 6.1 kB minified</text><text x="160" y="182" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">SigV4a presign</text><rect x="170" y="168" width="266.024" height="20" rx="3" fill="#f0883e"/><text x="442.024" y="182" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">3.0 kB gzip · 6.1 kB minified</text><text x="160" y="212" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">chunked uploads</text><rect x="170" y="198" width="128.216" height="20" rx="3" fill="#f0883e"/><text x="304.216" y="212" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">1.5 kB gzip · 2.8 kB minified</text><text x="160" y="242" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">event streams</text><rect x="170" y="228" width="141.94400000000002" height="20" rx="3" fill="#f0883e"/><text x="317.944" y="242" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">1.6 kB gzip · 3.1 kB minified</text><text x="160" y="272" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">everything</text><rect x="170" y="258" width="446.86400000000003" height="20" rx="3" fill="#f0883e"/><text x="622.864" y="272" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">5.1 kB gzip · 12.1 kB minified</text><text x="20" y="316" font-size="11" fill="#9198a1" text-anchor="start" font-weight="400">Bundled with bun build --minify; Node and Bun built-ins are not counted.</text>
</svg>
