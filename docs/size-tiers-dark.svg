<svg xmlns="http://www.w3.org/2000/svg" width="780" height="328" viewBox="0 0 780 328" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Size of sigflint by signer</title><desc id="d">headers 2654 B gzip, headers + presign 3053 B gzip, SigV4a headers 3120 B gzip, SigV4a presign 2973 B gzip, chunked uploads 1299 B gzip, event streams 1491 B gzip, everything 4634 B gzip</desc>
<rect width="780" height="328" rx="8" fill="#0d1117"/>
<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">What you ship depends on what you import (lower is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">sigflint’s Node entry bundled with only the named signers, minified, then gzip.</text><line x1="170" y1="70" x2="170" y2="282" stroke="#30363d"/><text x="170" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">0 kB</text><line x1="258" y1="70" x2="258" y2="282" stroke="#30363d"/><text x="258" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1 kB</text><line x1="346" y1="70" x2="346" y2="282" stroke="#30363d"/><text x="346" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">2 kB</text><line x1="434" y1="70" x2="434" y2="282" stroke="#30363d"/><text x="434" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">3 kB</text><line x1="522" y1="70" x2="522" y2="282" stroke="#30363d"/><text x="522" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">4 kB</text><line x1="610" y1="70" x2="610" y2="282" stroke="#30363d"/><text x="610" y="296" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">5 kB</text><text x="160" y="92" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">headers</text><rect x="170" y="78" width="233.55200000000002" height="20" rx="3" fill="#f0883e"/><text x="409.552" y="92" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">2.7 kB gzip · 5.4 kB minified</text><text x="160" y="122" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">headers + presign</text><rect x="170" y="108" width="268.664" height="20" rx="3" fill="#f0883e"/><text x="444.664" y="122" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">3.1 kB gzip · 6.6 kB minified</text><text x="160" y="152" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">SigV4a headers</text><rect x="170" y="138" width="274.56" height="20" rx="3" fill="#f0883e"/><text x="450.56" y="152" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">3.1 kB gzip · 6.4 kB minified</text><text x="160" y="182" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">SigV4a presign</text><rect x="170" y="168" width="261.62399999999997" height="20" rx="3" fill="#f0883e"/><text x="437.62399999999997" y="182" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">3.0 kB gzip · 6.1 kB minified</text><text x="160" y="212" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">chunked uploads</text><rect x="170" y="198" width="114.31200000000001" height="20" rx="3" fill="#f0883e"/><text x="290.312" y="212" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">1.3 kB gzip · 2.5 kB minified</text><text x="160" y="242" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">event streams</text><rect x="170" y="228" width="131.20800000000003" height="20" rx="3" fill="#f0883e"/><text x="307.208" y="242" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">1.5 kB gzip · 2.9 kB minified</text><text x="160" y="272" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="400">everything</text><rect x="170" y="258" width="407.79200000000003" height="20" rx="3" fill="#f0883e"/><text x="583.792" y="272" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">4.6 kB gzip · 11.0 kB minified</text><text x="20" y="316" font-size="11" fill="#9198a1" text-anchor="start" font-weight="400">Bundled with bun build --minify; Node and Bun built-ins are not counted.</text>
</svg>
