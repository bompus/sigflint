<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Time to sign one request, plain GET (lower is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">Median of 5 separate processes per library and runtime; log scale. A plain GET, which every library here signs correctly.</text><text x="20" y="80" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Node.js 26.11.1</text><line x1="190" y1="88" x2="190" y2="286" stroke="#30363d"/><text x="190" y="302" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1</text><line x1="323.33333333333337" y1="88" x2="323.33333333333337" y2="286" stroke="#30363d"/><text x="323.33333333333337" y="302" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">10</text><line x1="456.6666666666667" y1="88" x2="456.6666666666667" y2="286" stroke="#30363d"/><text x="456.6666666666667" y="302" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">100</text><line x1="590" y1="88" x2="590" y2="286" stroke="#30363d"/><text x="590" y="302" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1,000</text><text x="180" y="108" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="94" width="37.38009240613408" height="19" rx="3" fill="#f0883e"/><text x="233.38009240613408" y="108" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">1.91 µs</text><text x="180" y="136" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="122" width="104.03270451538037" height="19" rx="3" fill="#6e7681"/><text x="300.0327045153804" y="136" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">6.03 µs  (3×)</text><text x="180" y="164" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="150" width="136.22471362876075" height="19" rx="3" fill="#6e7681"/><text x="332.22471362876075" y="164" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">11 µs  (6×)</text><text x="180" y="192" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">minio</text><rect x="190" y="178" width="143.22105595964211" height="19" rx="3" fill="#6e7681"/><text x="339.2210559596421" y="192" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">12 µs  (6×)</text><text x="180" y="220" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="206" width="236.19892537119188" height="19" rx="3" fill="#6e7681"/><text x="432.1989253711919" y="220" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">59 µs  (31×)</text><text x="180" y="248" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="234" width="315.6432310864205" height="19" rx="3" fill="#6e7681"/><text x="511.6432310864205" y="248" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">233 µs  (122×)</text><text x="180" y="276" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="262" width="381.47727565257105" height="19" rx="3" fill="#6e7681"/><text x="577.477275652571" y="276" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">726 µs  (381×)</text><text x="390" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">microseconds per signature (log scale)</text><text x="20" y="358" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Bun 1.4.3</text><line x1="190" y1="366" x2="190" y2="564" stroke="#30363d"/><text x="190" y="580" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1</text><line x1="323.33333333333337" y1="366" x2="323.33333333333337" y2="564" stroke="#30363d"/><text x="323.33333333333337" y="580" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">10</text><line x1="456.