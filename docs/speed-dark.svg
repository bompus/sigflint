<svg xmlns="http://www.w3.org/2000/svg" width="760" height="654" viewBox="0 0 760 654" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Signing time per request</title><desc id="d">sigflint 1.3/1.7 µs, aws4fetch 235.4/221.7 µs, aws4 6.0/9.7 µs, @smithy/signature-v4 10.4/12.9 µs, aws-sig 64.8/48.7 µs, @wdl-dev/aws-sigv4 716.2/580.7 µs, minio 11.7/9.0 µs</desc>
<rect width="760" height="654" rx="8" fill="#0d1117"/>
<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Time to sign one request, plain GET (lower is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">Median of 5 separate processes per library and runtime; log scale. A plain GET, which every library here signs correctly.</text><text x="20" y="65" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">Measured before the S3 code was split into modules; the shipped code is within 4% of it (no clear change).</text><text x="20" y="98" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Node.js 26.11.1</text><line x1="190" y1="106" x2="190" y2="304" stroke="#30363d"/><text x="190" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1</text><line x1="323.33333333333337" y1="106" x2="323.33333333333337" y2="304" stroke="#30363d"/><text x="323.33333333333337" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">10</text><line x1="456.6666666666667" y1="106" x2="456.6666666666667" y2="304" stroke="#30363d"/><text x="456.6666666666667" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">100</text><line x1="590" y1="106" x2="590" y2="304" stroke="#30363d"/><text x="590" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1,000</text><text x="180" y="126" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="112" width="15.636172754101892" height="19" rx="3" fill="#f0883e"/><text x="211.6361727541019" y="126" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">1.31 µs</text><text x="180" y="154" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="140" width="104.1190811582772" height="19" rx="3" fill="#6e7681"/><text x="300.1190811582772" y="154" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">6.04 µs  (5×)</text><text x="180" y="182" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="168" width="135.4706617434698" height="19" rx="3" fill="#6e7681"/><text x="331.4706617434698" y="182" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">10.4 µs  (8×)</text><text x="180" y="210" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">minio</text><rect x="190" y="196" width="142.25626294586618" height="19" rx="3" fill="#6e7681"/><text x="338.2562629458662" y="210" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">11.7 µs  (9×)</text><text x="180" y="238" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="224" width="241.52456526371918" height="19" rx="3" fill="#6e7681"/><text x="437.5245652637192" y="238" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">64.8 µs  (49×)</text><text x="180" y="266" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="252" width="316.24307499760147" height="19" rx="3" fill="#6e7681"/><text x="512.2430749976015" y="266" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">235 µs  (180×)</text><text x="180" y="294" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="280" width="380.6715656290319" height="19" rx="3" fill="#6e7681"/><text x="576.6715656290319" y="294" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400">716 µs  (547×)</text><text x="390" y="338" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">microseconds per signature (log scale)</text><text x="20" y="376" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Bun 1.4.3</text><line x1="190" y1="384" x2="190" y2="582" stroke="#30363d"/><text x="190" y="598" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1</text><line x1=