<svg xmlns="http://www.w3.org/2000/svg" width="760" height="654" viewBox="0 0 760 654" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Signing time per request</title><desc id="d">sigflint 1.4/1.6 µs, aws4fetch 226.0/208.6 µs, aws4 5.7/6.1 µs, @smithy/signature-v4 10.2/9.2 µs, aws-sig 58.2/48.8 µs, @wdl-dev/aws-sigv4 698.6/581.9 µs, minio 11.3/7.3 µs</desc>
