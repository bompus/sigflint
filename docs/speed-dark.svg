<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Time to sign one request, plain GET (lower is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">Median of 3 separate processes per library and runtime; log scale. A plain GET, which every library here signs correctly.</text><text x="20" y="65" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">Measured on the shipped build; each process checks its signature before timing.</text><text x="20" y="98" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Node.js 26.12.1</text><line x1="190" y1="106" x2="190" y2="304" stroke="#30363d"/><text x="190" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1</text><line x1="323.33333333333337" y1="106" x2="323.33333333333337" y2="304" stroke="#30363d"/><text x="323.33333333333337" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">10</text><line x1="456.6666666666667" y1="106" x2="456.6666666666667" y2="304" stroke="#30363d"/><text x="456.6666666666667" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">100</text><line x1="590" y1="106" x2="590" y2="304" stroke="#30363d"/><text x="590" y="320" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1,000</text><text x="180" y="126" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="112" width="2" height="19" rx="3" fill="#f0883e"/><text x="198" y="126" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">0.97 µs</text><text x="180" y="154" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="140" width="94.42211438073866" height="19" rx="3" fill="#6e7681"/><text x="290.42211438073866" y="154" font-size="12" fill="#e6edf3" text-anchor="start" 