<svg xmlns="http://www.w3.org/2000/svg" width="760" height="636" viewBox="0 0 760 636" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Signing time per request</title><desc id="d">sigflint 1.9/1.6 µs, aws4fetch 233.0/213.1 µs, aws4 6.0/7.7 µs, @smithy/signature-v4 10.5/9.8 µs, aws-sig 59.1/44.3 µs, @wdl-dev/aws-sigv4 726.2/584.4 µs, minio 11.9/8.2 µs</desc>
