<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Size of the code you ship</title><desc id="d">sigflint 2769 B, aws4fetch 2927 B, aws4 3249 B, smithy 45963 B, aws-sig 4173 B, wdl 5504 B, minio 84973 B</desc>
<rect width="760" height="330" rx="8" fill="#0d1117"/>
<text x="20" y="28" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Size once bundled (lower is better)</text><text x="20" y="48" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">The signer and everything it imports, minified, then gzip. Node and Bun built-ins are not counted.</text><line x1="190" y1="60" x2="190" y2="258" stroke="#30363d"/><text x="190" y="274" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">0.1</text><line x1="323.33333333333337" y1="60" x2="323.33333333333337" y2="258" stroke="#30363d"/><text x="323.33333333333337" y="274" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1</text><line x1="456.6666666666667" y1="60" x2="456.6666666666667" y2="258" stroke="#30363d"/><text x="456.6666666666667" y="274" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">10</text><line x1="590" y1="60" x2="590" y2="258" stroke="#30363d"/><text x="590" y="274" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">100</text><text x="180" y="80" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">sigflint</text><rect x="190" y="66" width="192.30972743274333" height="19" rx="3" fill="#f0883e"/><text x="388.30972743274333" y="80" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2.8 kB</text><text x="180" y="108" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4fetch</text><rect x="190" y="94" width="195.52302965783895" height="19" rx="3" fill="#6e7681"/><text x="391.52302965783895" y="108" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2.9 kB</text><text x="180" y="136" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws4</text><rect x="190" y="122" width="201.56662817933102" height="19" rx="3" fill="#6e7681"/><text x="397.566628179331" y="136" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3.2 kB</text><text x="180" y="164" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">aws-sig</text><rect x="190" y="150" width="216.05978462822782" height="19" rx="3" fill="#6e7681"/><text x="412.0597846282278" y="164" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4.2 kB</text><text x="180" y="192" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@wdl-dev/aws-sigv4</text><rect x="190" y="178" width="232.090456696994" height="19" rx="3" fill="#6e7681"/><text x="428.090456696994" y="192" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5.5 kB</text><text x="180" y="220" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">@smithy/signature-v4</text><rect x="190" y="206" width="354.9877823059819" height="19" rx="3" fill="#6e7681"/><text x="550.9877823059819" y="220" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">46.0 kB  (+3 deps)</text><text x="180" y="248" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">minio</text><rect x="190" y="234" width="390.57079352463074" height="19" rx="3" fill="#6e7681"/><text x="586.5707935246307" y="248" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">85.0 kB  (+13 deps)</text><text x="390" y="292" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">kilobytes, bundled and minified, then gzip (log scale)</text><text x="20" y="318" font-size="11" fill="#9198a1" text-anchor="start" font-weight="400">Not measured: s3mini, tiny-oss, lean-s3, s3-lite-client.</text>
