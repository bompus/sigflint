name: Publish

# Runs when a version tag is pushed. npm trusted publishing (OIDC) signs the provenance statement; no token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Benchmarks were re-run on this code
        run: node bench/check-benchmarked.mjs
      - run: npm ci
      - run: npm test
      - run: npm run types
      - run: npm run check:package
      - run: npm publish --provenance --access public
