name: Publish

# Runs when a version tag is pushed. npm trusted publishing (OIDC) signs the provenance statement; no token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Benchmarks were re-run on this code
        run: node bench/check-benchmarked.mjs
      # npm run build bundles dist/ with bun build, pinned so every build makes the same dist/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npm test
      - run: npm run types
      - run: npm run check:package
      # A rerun after a partial failure must not fail on a version that is already on the registry.
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip $name@$version (already published)"
          else
            npm publish --provenance --access public
          fi
      # npm can take about a minute to show a new version, so a green run means the version is really on the registry (up to 5 minutes).
      - name: Verify the version is on the registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # each lookup is bounded (10 s, no retry) so 30 tries cannot outlast the job timeout
          for i in $(seq 1 30); do
            if npm view "$name@$version" version --fetch-timeout=10000 --fetch-retries=0 >/dev/null 2>&1; then
              echo "verified $name@$version"
              exit 0
            fi
            echo "waiting for $name@$version to appear ($i of 30)"
            sleep 10
          done
          echo "::error::$name@$version never appeared on the registry"
          exit 1
