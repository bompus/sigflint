name: Publish

# Runs when a version tag is pushed. npm trusted publishing (OIDC) signs the provenance statement; no token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run types
      - run: npm run check:package
      - run: npm publish --provenance --access public
